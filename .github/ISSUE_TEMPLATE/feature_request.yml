name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first. What's annoying or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: A sketch of the key or page helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
  - type: dropdown
    id: device
    attributes:
      label: Which Stream Deck do you use?
      options:
        - Stream Deck XL
        - Stream Deck (15 keys)
        - Stream Deck Mini
        - Stream Deck +
        - Other
