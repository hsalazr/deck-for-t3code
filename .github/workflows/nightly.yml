name: Nightly

# Builds main when new plugin code lands on it and publishes it as the nightly
# pre-release. Stable releases stay on `v*` tags (release.yml).
# Releases in this repo are immutable: once a release has used a tag name, GitHub
# never lets that name be used again, not even after the release is deleted. So
# each nightly gets its own tag (`nightly-<manifest version>`), and the older
# nightly is removed after the new one is out.
# No schedule: a push that changes what ships is the only automatic trigger.
# Docs, site and changelog-only pushes don't rebuild it; run it by hand to force one.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "*.sdPlugin/**"
      - "package.json"
      - "package-lock.json"
      - "rollup.config.mjs"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance attestations: sign with the workflow's OIDC identity, store the attestation.
  id-token: write
  attestations: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    # GitHub only, and only from main: a nightly is "what main looks like now".
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Find the plugin folder
        id: plugin
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(*.sdPlugin)
          [ "${#dirs[@]}" -eq 1 ] || { echo "Expected exactly one *.sdPlugin folder, found ${#dirs[@]}"; exit 1; }
          echo "dir=${dirs[0]}" >> "$GITHUB_OUTPUT"

      # The manifest's fourth part is the build number: nightly 1.0.0.N sorts after
      # stable 1.0.0 (1.0.0.0) and before the next stable release.
      - name: Stamp the nightly version
        id: version
        env:
          PLUGIN_DIR: ${{ steps.plugin.outputs.dir }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(node -e '
            const fs = require("fs");
            const file = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            const [a, b, c] = manifest.Version.split(".");
            manifest.Version = `${a}.${b}.${c}.${process.env.RUN}`;
            fs.writeFileSync(file, JSON.stringify(manifest, null, "\t") + "\n");
            console.log(manifest.Version);
          ' "$PLUGIN_DIR/manifest.json")
          base="${version%.*}"
          # The client version T3 Code sees: build metadata, so it never sorts before the stable one.
          sed -i '' "s/^export const PLUGIN_VERSION = \".*\";/export const PLUGIN_VERSION = \"$base+nightly.$RUN\";/" src/version.ts
          grep -q "+nightly.$RUN" src/version.ts
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # What people see: v<major>.<minor>.<patch>, with the nightly as build metadata.
          echo "semver=v$base+nightly.$RUN" >> "$GITHUB_OUTPUT"
          echo "Nightly version v$base+nightly.$RUN (manifest $version)"

      - run: npm run build

      - name: Validate and pack
        env:
          PLUGIN_DIR: ${{ steps.plugin.outputs.dir }}
        run: |
          set -euo pipefail
          npx streamdeck validate --no-update-check "$PLUGIN_DIR"
          mkdir -p dist
          npx streamdeck pack --no-update-check --output dist "$PLUGIN_DIR"
          (cd dist && shasum -a 256 *.streamDeckPlugin > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l dist

      # Lets anyone check a download came from this workflow:
      # gh attestation verify <file> --repo hsalazr/deck-for-t3code
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.streamDeckPlugin

      - name: Publish the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail
          tag="nightly-$VERSION"
          # A re-run of a build that already published has nothing left to do. A draft left
          # by a failed upload was never published, so its tag name is still free.
          state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$state" = "false" ]; then
            echo "$tag is already published."
            exit 0
          fi
          if [ "$state" = "true" ]; then
            gh release delete "$tag" --yes
          fi
          short="${GITHUB_SHA:0:7}"
          {
            echo "Nightly build of \`main\` at $short ($SEMVER; Stream Deck shows $VERSION, since its manifest needs four parts), built $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "Untested beyond CI and may break. Installing it replaces Deck for T3 Code on your deck; your keys and settings stay. To go back, install the latest stable release from the Releases page."
            echo
            # What main has that the last stable release doesn't, if the changelog says.
            awk '
              /^## \[Unreleased\]/ { on = 1; print "## Changes since the last release"; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
          } > notes.md
          gh release create "$tag" dist/*.streamDeckPlugin dist/SHA256SUMS.txt \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly $SEMVER" --notes-file notes.md
          # Only the newest nightly stays. The new one is out by now, so trouble here is a
          # warning, not a failed build.
          older=$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("nightly-"))) | .tagName') || {
            echo "::warning::Could not list the older nightlies"
            older=""
          }
          for old in $older; do
            [ "$old" = "$tag" ] && continue
            gh release delete "$old" --yes --cleanup-tag || echo "::warning::Could not remove the older nightly $old"
          done
