name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # GitHub only: it publishes a GitHub Release. Mirrors such as Gitea run CI (ci.yml) but not this.
    if: github.server_url == 'https://github.com'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Find the plugin folder
        id: plugin
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(*.sdPlugin)
          [ "${#dirs[@]}" -eq 1 ] || { echo "Expected exactly one *.sdPlugin folder, found ${#dirs[@]}"; exit 1; }
          echo "dir=${dirs[0]}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
          PLUGIN_DIR: ${{ steps.plugin.outputs.dir }}
        run: |
          set -euo pipefail
          manifest=$(node -p "require('./$PLUGIN_DIR/manifest.json').Version")
          tag="${TAG#v}"
          # Stream Deck manifests use four parts (1.0.0.0); tags use three (v1.0.0).
          if [ "$manifest" != "$tag" ] && [ "$manifest" != "$tag.0" ]; then
            echo "Tag $TAG does not match manifest Version $manifest"
            exit 1
          fi

      - name: Validate and pack
        env:
          PLUGIN_DIR: ${{ steps.plugin.outputs.dir }}
        run: |
          set -euo pipefail
          npx streamdeck validate --no-update-check "$PLUGIN_DIR"
          mkdir -p dist
          npx streamdeck pack --no-update-check --output dist "$PLUGIN_DIR"
          ls -l dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Use the matching CHANGELOG section as release notes, if there is one.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" dist/*.streamDeckPlugin --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/*.streamDeckPlugin --title "$TAG" --generate-notes
          fi
